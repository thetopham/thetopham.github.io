<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 4 - Calendar</title>

    <!-- Bootstrap CSS (already allowed by lab) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Project CSS (relative path as required) -->
    <link rel="stylesheet" href="./resources/css/style.css" />
  </head>
  <body>
    <div class="row">
      <div class="col-2">
        <div class="custom-container">
          <!-- Step 2: open modal on click -->
          <button
            class="btn btn-primary mt-3"
            data-bs-toggle="modal"
            data-bs-target="#event_modal"
          >
            Create Event
          </button>
        </div>
      </div>

      <div class="col">
        <div class="container-md container-fluid py-4 h-100">
          <div id="calendar" class="row h-100">
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
              <div class="h6 text-center position-relative py-2 day">Sunday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
              <div class="h6 text-center position-relative py-2 day">Monday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
              <div class="h6 text-center position-relative py-2 day">Tuesday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
              <div class="h6 text-center position-relative py-2 day">Wednesday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
              <div class="h6 text-center position-relative py-2 day">Thursday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
              <div class="h6 text-center position-relative py-2 day">Friday</div>
            </div>
            <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
              <div class="h6 text-center position-relative py-2 day">Saturday</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Project JS (relative path as required) -->
    <script src="resources/js/script.js"></script>

    <!-- Step 1: Modal -->
    <div
      class="modal fade"
      id="event_modal"
      tabindex="-1"
      aria-labelledby="event_modal_label"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="event_modal_label">Create / Update Event</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <form id="event_form">
              <!-- Event Name -->
              <div class="mb-3">
                <label for="event_name" class="form-label">Event Name</label>
                <input
                  type="text"
                  id="event_name"
                  class="form-control"
                  required
                  minlength="2"
                  maxlength="100"
                  placeholder="e.g., Team Standup"
                />
              </div>

              <!-- Weekday -->
              <div class="mb-3">
                <label for="event_weekday" class="form-label">Weekday</label>
                <select id="event_weekday" class="form-select" required>
                  <option value="" selected disabled>Select a day</option>
                  <option>Sunday</option>
                  <option>Monday</option>
                  <option>Tuesday</option>
                  <option>Wednesday</option>
                  <option>Thursday</option>
                  <option>Friday</option>
                  <option>Saturday</option>
                </select>
              </div>

              <!-- Time -->
              <div class="mb-3">
                <label for="event_time" class="form-label">Time</label>
                <input type="time" id="event_time" class="form-control" required />
              </div>

              <!-- Event Modality -->
              <div class="mb-3">
                <label for="event_modality" class="form-label">Event Modality</label>
                <select
                  class="form-control"
                  id="event_modality"
                  required
                  onchange="updateLocationOptions(this.value)"
                >
                  <option value="in-person">In Person</option>
                  <option value="remote">Remote</option>
                </select>
              </div>

              <!-- Category (Part C minimal) -->
              <div class="mb-3">
                <label for="event_category" class="form-label">Category</label>
                <select id="event_category" class="form-select" required>
                  <option value="" selected disabled>Select a category</option>
                  <option value="academic">Academic</option>
                  <option value="work">Work</option>
                  <option value="personal">Personal</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <!-- In-Person group -->
              <div id="in_person_group" class="mb-3">
                <label for="event_location" class="form-label">Location</label>
                <input
                  type="text"
                  id="event_location"
                  class="form-control"
                  placeholder="e.g., Room 210, Engineering Center"
                />
              </div>

              <!-- Remote group -->
              <div id="remote_group" class="mb-3">
                <label for="event_remote_url" class="form-label">Remote URL</label>
                <input
                  type="url"
                  id="event_remote_url"
                  class="form-control"
                  placeholder="Paste meeting link (Zoom, Teams, Meet, etc.)"
                  pattern="^(https?:\/\/)([\w\-]+(\.[\w\-]+)+)(:[0-9]{2,5})?(\/[^\s]*)?$"
                />
              </div>

              <!-- Attendees (single field, works for both modalities) -->
              <div class="mb-3">
                <label for="event_attendees" class="form-label">Attendees</label>
                <input
                  type="text"
                  id="event_attendees"
                  class="form-control"
                  placeholder="Enter names separated by commas: Alice, Bob, Charlie"
                  pattern="^\s*[A-Za-z][A-Za-z .'-]*(\s*,\s*[A-Za-z][A-Za-z .'-]*)*\s*$"
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Close
            </button>
            <button class="btn btn-primary" type="button" onclick="saveEvent()">
              Save Event
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
